name: Release kernel modules

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  # Every kernel of this series in the Raspberry Pi trixie repository gets a module.
  KERNEL_SERIES: "6.18"

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    runs-on: ubuntu-24.04-arm
    # Same Debian release (and gcc) the Raspberry Pi kernels are built with.
    container: debian:trixie
    strategy:
      matrix:
        flavor: [rpi-v8, rpi-2712, rpi-v8-rt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build modules
        run: bash .github/build-modules.sh ${{ matrix.flavor }} ${{ env.KERNEL_SERIES }} out

      - name: Upload modules
        uses: actions/upload-artifact@v7
        with:
          name: modules-${{ matrix.flavor }}
          path: out/
          if-no-files-found: error

  overlay:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Shipped with the modules: the driver creates the overlay's shutdown key and SYSUP LED.
      - name: Build overlay
        run: bash .github/build-overlay.sh out

      - name: Upload overlay
        uses: actions/upload-artifact@v7
        with:
          name: overlay
          path: out/
          if-no-files-found: error

  python:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The release tag is the package version; pip normalizes it (0.2.0-rc1 -> 0.2.0rc1).
      - name: Set version from tag
        run: sed -i "s/^version = .*/version = \"${GITHUB_REF_NAME}\"/" pyproject.toml

      - name: Build sdist and wheel
        run: pipx run build --outdir dist .

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  release:
    runs-on: ubuntu-24.04-arm
    needs: [test, build, overlay, python]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The tag's CHANGELOG.md section, plus its link definitions for references like [#9].
      - name: Extract release notes
        run: |
          awk -v h="## [$GITHUB_REF_NAME]" 'index($0, h) == 1 {f = 1; next} /^## \[/ {f = 0} f' CHANGELOG.md > release-notes.md
          grep '^\[.*\]: ' CHANGELOG.md >> release-notes.md

      - name: Download modules
        uses: actions/download-artifact@v8
        with:
          pattern: modules-*
          path: out
          merge-multiple: true

      - name: Download overlay
        uses: actions/download-artifact@v8
        with:
          name: overlay
          path: out

      - name: Download Python package
        uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist

      # One tarball laid out like the target filesystem: kernel versions contain
      # "+", which GitHub rewrites in release asset names.
      - name: Package modules
        run: |
          tar -C out -czf rtc-pcf85063-wittypi4-modules.tar.gz lib boot
          sha256sum rtc-pcf85063-wittypi4-modules.tar.gz dist/* | sed 's|dist/||' > SHA256SUMS
          {
            echo "### Kernels"
            find out/lib/modules -mindepth 1 -maxdepth 1 -printf '- %f\n' | sort -V
          } >> "$GITHUB_STEP_SUMMARY"

      # SemVer pre-release tags (0.2.0-rc1) become prereleases, plain versions releases.
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: |
            rtc-pcf85063-wittypi4-modules.tar.gz
            dist/*
            SHA256SUMS
