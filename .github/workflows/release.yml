name: Release kernel modules

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  # Every kernel of this series in the Raspberry Pi trixie repository gets a module.
  KERNEL_SERIES: "6.18"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    # Same Debian release (and gcc) the Raspberry Pi kernels are built with.
    container: debian:trixie
    strategy:
      matrix:
        flavor: [rpi-v8, rpi-2712, rpi-v8-rt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build modules
        run: bash .github/build-modules.sh ${{ matrix.flavor }} ${{ env.KERNEL_SERIES }} out

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: modules-${{ matrix.flavor }}
          path: out/
          if-no-files-found: error

  release:
    runs-on: ubuntu-24.04-arm
    needs: build
    steps:
      - name: Download modules
        uses: actions/download-artifact@v4
        with:
          pattern: modules-*
          path: out
          merge-multiple: true

      # One tarball laid out like the target filesystem: kernel versions contain
      # "+", which GitHub rewrites in release asset names.
      - name: Package modules
        run: |
          tar -C out -czf rtc-pcf85063-wittypi4-modules.tar.gz lib
          sha256sum rtc-pcf85063-wittypi4-modules.tar.gz > SHA256SUMS
          {
            echo "### Kernels"
            find out/lib/modules -mindepth 1 -maxdepth 1 -printf '- %f\n' | sort -V
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            rtc-pcf85063-wittypi4-modules.tar.gz
            SHA256SUMS
